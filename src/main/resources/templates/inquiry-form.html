
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問い合わせ登録</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            background: #f5f7fa;
        }
        form {
            background: white;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 8px;
        }
        input, textarea, select {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: inherit;
        }
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        .error {
            color: #c62828;
            font-size: 14px;
            margin-top: 6px;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button, .back {
            padding: 10px 16px;
            border-radius: 5px;
            font: inherit;
            text-decoration: none;
        }
        button {
            color: white;
            background: #2563eb;
            border: none;
            cursor: pointer;
        }
        .back {
            color: #333;
            background: #eee;
        }
    </style>
</head>
<body>
<h1>問い合わせ登録</h1>

<form th:action="@{/inquiries}"
      th:object="${inquiry}"
      method="post">

    <label for="title">件名</label>
    <input id="title" type="text" th:field="*{title}"
           maxlength="200" required>
    <div class="error"
         th:if="${#fields.hasErrors('title')}"
         th:errors="*{title}"></div>

    <label for="description">詳細</label>
    <textarea id="description"
              th:field="*{description}" required></textarea>
    <div class="error"
         th:if="${#fields.hasErrors('description')}"
         th:errors="*{description}"></div>

    <label for="priority">優先度</label>
    <select id="priority" th:field="*{priority}">
        <option value="LOW">低</option>
        <option value="MEDIUM">中</option>
        <option value="HIGH">高</option>
    </select>

    <div class="actions">
        <button type="submit">登録する</button>
        <a class="back" th:href="@{/}">戻る</a>
    </div>
</form>
</body>
</html>

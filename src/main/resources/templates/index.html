
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問い合わせ・不具合管理</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            background: #f5f7fa;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .button {
            display: inline-block;
            padding: 10px 16px;
            color: white;
            background: #2563eb;
            text-decoration: none;
            border-radius: 5px;
        }
        .panel {
            background: white;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f5f7fa;
        }
        .empty {
            padding: 24px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="header">
    <div>
        <h1>問い合わせ・不具合管理</h1>
        <p>問い合わせと不具合の対応状況を管理します。</p>
    </div>
    <a class="button" th:href="@{/inquiries/new}">
        新規登録
    </a>
</div>

<section class="panel">
    <h2>問い合わせ一覧</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>件名</th>
            <th>優先度</th>
            <th>ステータス</th>
            <th>登録日時</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inquiry : ${inquiries}">
            <td th:text="${inquiry.id}"></td>
            <td th:text="${inquiry.title}"></td>
            <td th:text="${inquiry.priority == 'HIGH' ? '高' :
                        (inquiry.priority == 'LOW' ? '低' : '中')}"></td>
            <td th:text="${inquiry.status == 'OPEN' ? '未対応' :
                        (inquiry.status == 'IN_PROGRESS' ? '対応中' : '完了')}"></td>
            <td th:text="${#temporals.format(
                        inquiry.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(inquiries)}">
            <td colspan="5" class="empty">
                問い合わせはまだ登録されていません。
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>

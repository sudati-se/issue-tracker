
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">問い合わせ・不具合管理</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            background: #f5f7fa;
        }

        h1 {
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            margin-bottom: 28px;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f5f7fa;
        }

        .status {
            color: #8a5a00;
            background: #fff1cc;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<h1 th:text="${pageTitle}">問い合わせ・不具合管理</h1>
<p class="description">
    問い合わせと不具合の対応状況を管理するWebアプリです。
</p>

<section class="panel">
    <h2>問い合わせ一覧</h2>
    <p>現在は画面の動作確認用データを表示しています。</p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>件名</th>
            <th>優先度</th>
            <th>ステータス</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>1</td>
            <td>ログインできない</td>
            <td>高</td>
            <td><span class="status">未対応</span></td>
        </tr>
        <tr>
            <td>2</td>
            <td>画面表示が崩れる</td>
            <td>中</td>
            <td><span class="status">対応中</span></td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
